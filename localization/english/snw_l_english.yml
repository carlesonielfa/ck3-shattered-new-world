l_english:
 rule_snw_enabled:0 "#X SNW:#! Shattered New World"
 setting_snw_enabled_on:0 "On"
 setting_snw_enabled_on_desc:0 "At game start, the historical political map is broken up and every landed ruler is replaced with a newly generated character. Only the geography is historical."
 setting_snw_enabled_off:0 "#high Off#!"
 setting_snw_enabled_off_desc:0 "The historical setup is left untouched. All other Shattered New World rules are ignored."

 rule_snw_shatter_level:0 "#X SNW:#! Break Up Realms"
 setting_snw_shatter_empires:0 "Empires"
 setting_snw_shatter_empires_desc:0 "Every empire is dissolved. Kingdoms become the largest independent realms; their dukes and counts stay their vassals."
 setting_snw_shatter_kingdoms:0 "Kingdoms and Empires"
 setting_snw_shatter_kingdoms_desc:0 "Every empire and kingdom is dissolved. Duchies become the largest independent realms; their counts stay their vassals."
 setting_snw_shatter_duchies:0 "Duchies, Kingdoms and Empires"
 setting_snw_shatter_duchies_desc:0 "Every title above county is dissolved and every count is independent. A count who held several counties keeps them together."
 setting_snw_shatter_counties:0 "Every County"
 setting_snw_shatter_counties_desc:0 "Every title above county is dissolved and each county gets its own independent ruler."

 rule_snw_ruler_age:0 "#X SNW:#! Ruler Ages"
 setting_snw_ruler_age_standard:0 "Standard"
 setting_snw_ruler_age_standard_desc:0 "Rulers are 18 to 60 years old, most of them in their thirties and forties."
 setting_snw_ruler_age_young:0 "Young"
 setting_snw_ruler_age_young_desc:0 "Rulers are 16 to 35 years old."
 setting_snw_ruler_age_mature:0 "Mature"
 setting_snw_ruler_age_mature_desc:0 "Rulers are 35 to 70 years old."
 setting_snw_ruler_age_any:0 "Any"
 setting_snw_ruler_age_any_desc:0 "Rulers are 2 to 75 years old. Some realms start under child rulers."

 rule_snw_family:0 "#X SNW:#! Ruler Families"
 setting_snw_family_large:0 "Large"
 setting_snw_family_large_desc:0 "Adult rulers usually have a spouse and children, and often siblings from a deceased father."
 setting_snw_family_small:0 "Small"
 setting_snw_family_small_desc:0 "Adult rulers usually have a spouse and children."
 setting_snw_family_none:0 "None"
 setting_snw_family_none_desc:0 "Rulers start without any family. #high Many dynasties will end early.#!"

 rule_snw_ruler_identity:0 "#X SNW:#! Ruler Culture and Faith"
 setting_snw_identity_previous:0 "Same as Realm"
 setting_snw_identity_previous_desc:0 "Each new ruler has the culture and faith of the historical ruler they replace, so the cultural and religious map of realms is kept."
 setting_snw_identity_local:0 "Local"
 setting_snw_identity_local_desc:0 "Each new ruler has the culture and faith of their capital county. Theocracies, holy orders and mercenaries always keep the faith of the ruler they replace."

 rule_snw_related_rulers:0 "#X SNW:#! Related Neighbours"
 setting_snw_related_some:0 "Some"
 setting_snw_related_some_desc:0 "Some new rulers belong to the same dynasty as a neighbouring ruler."
 setting_snw_related_many:0 "Many"
 setting_snw_related_many_desc:0 "Many new rulers belong to the same dynasty as a neighbouring ruler, forming regional dynasties."
 setting_snw_related_none:0 "None"
 setting_snw_related_none_desc:0 "Every new ruler founds their own dynasty."

 rule_snw_starting_resources:0 "#X SNW:#! Starting Resources"
 setting_snw_resources_normal:0 "Normal"
 setting_snw_resources_normal_desc:0 "Rulers start with some gold, prestige and piety, scaled by rank."
 setting_snw_resources_rich:0 "Rich"
 setting_snw_resources_rich_desc:0 "Rulers start with about twice the normal gold, prestige and piety."
 setting_snw_resources_none:0 "None"
 setting_snw_resources_none_desc:0 "Rulers start with no gold, prestige or piety."
